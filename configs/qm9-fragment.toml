dataset = "qm9"
model = "fragment"
loss_weights = "configs/fragment-weights.json"

[architecture]
width = 512
depth = 12
heads = 8
feedforward_width = 2048

[process]
source_sigma = 3.0
internal_clock_power = 16.0
internal_mobility_sigma = 0.15
internal_mobility_fade_start = 0.8
manifold_substep = 0.005
rotation_variance = 6.0
center_spread_sigma = 3.0
center_spread_timescale = 0.1

[training]
steps = 800000
balance_at = 100000
warmup_steps = 10000
warmdown_steps = 100000
learning_rate = 0.02
minimum_learning_rate = 1e-9
exponential_decay_factor = 0.06720097636955107
adamw_lr_multiplier = 0.1
ema_decay = 0.9999
logit_offset_weight = 0.01
accumulate = 2
checkpoint_every = 20000
keep_last_checkpoints = 2
validate_every = 5000
validation_batches = 64
calibration_batches = 64
holdout_batches = 32
seed = 50731031
